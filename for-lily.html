<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3c4d4" />
    <meta name="description" content="Mikrokosmos — quiet words written for Lily." />
    <title>Lily — Mikrokosmos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Serif+Myanmar:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./for-lily.css" />
</head>

<body>
    <div class="sky" aria-hidden="true">
        <div class="sky__glow sky__glow--a"></div>
        <div class="sky__glow sky__glow--b"></div>
        <div class="sky__stars" id="sky-stars"></div>
        <div class="sky__petals" id="sky-petals"></div>
    </div>

    <a class="skip-link" href="#reader">Skip to quotes</a>

    <!-- Cover: brand-first hero -->
    <section id="cover" class="cover" aria-label="Cover for Lily">
        <div class="cover__stage">
            <p class="cover__whisper">mikrokosmos</p>
            <h1 class="cover__brand">Lily</h1>
            <p class="cover__line">a little universe of words,<br />that keep thinking of you</p>

            <div class="cover__bloom" aria-hidden="true">
                <svg class="lily-svg" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="lily-svg__stem" d="M100 210 C98 160, 102 120, 100 78" stroke="currentColor"
                        stroke-width="3" stroke-linecap="round" />
                    <path class="lily-svg__leaf" d="M100 150 C70 140, 48 155, 42 178 C68 172, 88 165, 100 150Z"
                        fill="currentColor" />
                    <path class="lily-svg__leaf lily-svg__leaf--r"
                        d="M100 160 C130 148, 152 158, 158 180 C132 176, 112 170, 100 160Z" fill="currentColor" />
                    <g class="lily-svg__bloom">
                        <path d="M100 78 C88 40, 58 28, 42 48 C56 62, 78 72, 100 78Z" fill="currentColor" />
                        <path d="M100 78 C112 40, 142 28, 158 48 C144 62, 122 72, 100 78Z" fill="currentColor" />
                        <path d="M100 78 C70 58, 48 68, 44 98 C66 96, 86 90, 100 78Z" fill="currentColor" />
                        <path d="M100 78 C130 58, 152 68, 156 98 C134 96, 114 90, 100 78Z" fill="currentColor" />
                        <path d="M100 78 C92 48, 78 36, 70 52 C78 62, 90 72, 100 78Z" fill="currentColor" />
                        <path d="M100 78 C108 48, 122 36, 130 52 C122 62, 110 72, 100 78Z" fill="currentColor" />
                        <circle cx="100" cy="78" r="7" fill="#f7e7b0" />
                    </g>
                </svg>
            </div>

            <button type="button" class="cover__cta" id="enter-btn">
                Read for me
            </button>
        </div>
    </section>

    <!-- One-quote-per-page reader -->
    <section id="reader" class="reader is-hidden" aria-label="Quote pages" hidden>
        <header class="reader__top">
            <button type="button" class="icon-btn" id="back-cover" aria-label="Back to cover">
                <span aria-hidden="true">←</span>
            </button>
            <p class="reader__mark">for Lily</p>
            <p class="reader__count" id="page-count" aria-live="polite">1 / 1</p>
        </header>

        <div class="reader__stage" id="quote-stage">
            <article class="quote" id="quote-card" aria-live="polite">
                <p class="quote__title" id="quote-title" hidden></p>
                <p class="quote__body" id="quote-body"></p>
                <p class="quote__author" id="quote-author" hidden></p>
            </article>
        </div>

        <nav class="reader__nav" aria-label="Quote navigation">
            <button type="button" class="nav-btn" id="prev-btn" aria-label="Previous quote">
                Prev
            </button>
            <div class="reader__dots" id="progress-track" aria-hidden="true">
                <span class="reader__progress" id="progress-fill"></span>
            </div>
            <button type="button" class="nav-btn nav-btn--primary" id="next-btn" aria-label="Next quote">
                Next
            </button>
        </nav>

        <p class="reader__hint" id="swipe-hint">swipe or tap next</p>
    </section>

    <script src="./for-lily.js" defer></script>
</body>

</html>
